name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: i686-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-pc-windows-gnu
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vlmcsd dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/vlmcs dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libvlmcsd.a dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libvlmcsd.so dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libvlmcsd.dylib dist/ 2>/dev/null || true
          tar czf vlmcsd-rs-${{ matrix.target }}.tar.gz -C dist .

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/vlmcsd.exe" dist/ -ErrorAction SilentlyContinue
          Copy-Item "target/${{ matrix.target }}/release/vlmcs.exe" dist/ -ErrorAction SilentlyContinue
          Copy-Item "target/${{ matrix.target }}/release/vlmcsd.dll" dist/ -ErrorAction SilentlyContinue
          Copy-Item "target/${{ matrix.target }}/release/vlmcsd.lib" dist/ -ErrorAction SilentlyContinue
          Copy-Item "target/${{ matrix.target }}/release/vlmcsd.dll.lib" dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath "vlmcsd-rs-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlmcsd-rs-${{ matrix.target }}
          path: |
            vlmcsd-rs-${{ matrix.target }}.tar.gz
            vlmcsd-rs-${{ matrix.target }}.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
